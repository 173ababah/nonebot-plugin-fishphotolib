[project]
name = "nonebot-plugin-fishphotolib"
version = "0.1.0"
description = "图片库：相册/标签/搜索/随机 + dHash 去重 + 露点/二次元粗筛（nonebot2，可选 Vision 校验）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "173ababah" }]
keywords = ["nonebot2", "nonebot-plugin", "image-library", "dhash", "dedupe"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Nonebot2",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["nonebot2>=2.0.0"]

[project.optional-dependencies]
img = ["pillow>=9.0", "numpy>=1.21"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishphotolib"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
